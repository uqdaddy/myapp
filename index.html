<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8a5a2b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Register the service worker (offline caching + COOP/COEP header
      // injection). On hosts that already send real COOP/COEP headers
      // (e.g. Cloudflare Pages), the page is cross-origin isolated from the
      // first response and no reload is needed. On GitHub Pages the SW must
      // inject the headers, which only takes effect once it controls the page —
      // so we reload once when the page is not yet isolated.
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var alreadyIsolated = self.crossOriginIsolated === true;
        var reloaded = sessionStorage.getItem('coiReloaded');
        navigator.serviceWorker
          .register('sw.js')
          .then(function (reg) {
            // If real headers already isolate us, just keep the SW for caching.
            if (alreadyIsolated) return;
            if (reloaded) return;
            if (
              (navigator.serviceWorker.controller || reg.active) &&
              !self.crossOriginIsolated
            ) {
              sessionStorage.setItem('coiReloaded', '1');
              location.reload();
            }
          })
          .catch(function () {});
      })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <!-- No cross-origin webfont: under COEP require-corp it would be blocked.
         The app uses system serif/gothic fallbacks (see styles.css). -->
    <title>장기 · 체스 · 오목</title>
    <meta name="description" content="장기, 체스, 오목을 선택해 AI와 대국하는 보드게임" />
    <meta property="og:title" content="장기 · 체스 · 오목" />
    <meta property="og:description" content="장기, 체스, 오목을 선택해 AI와 대국하세요." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
